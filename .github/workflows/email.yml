name: Email giornaliera

on:
  schedule:
    - cron: "0 6 * * *"   # ogni giorno alle 06:00 UTC (08:00 in Italia col cambio ora legale)
  workflow_dispatch:       # per lanciarlo a mano

jobs:
  invia-mail:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Raccogli news e invia email
        env:
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: python notizie_calcio.py
