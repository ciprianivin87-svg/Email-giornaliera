name: Email giornaliera

on:
  schedule:
    # 09:00 UTC = 11:00 italiane (con ora legale UTC+2)
    # Cambia in '0 10 * * *' quando tornerà l'ora solare (UTC+1)
    - cron: '0 9 * * *'
  workflow_dispatch: # Permette l'avvio manuale dalla scheda Actions

jobs:
  invia-mail:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del codice
        uses: actions/checkout@v4

      - name: Configurazione di Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Installazione dipendenze
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Raccogli news e invia email
        env:
          # Aggiungi qui eventuali secret utilizzati dallo script Python
          # Esempio:
          # EMAIL_USER: ${{ secrets.EMAIL_USER }}
          # EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python notizie_calcio.py # Sostituisci main.py con il nome del tuo file script Python se diverso
